<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#146a71">
<meta name="description" content="كتيّب أذكار مصوّر للأطفال، مع قراءة صوتية داخل الصفحات وعمل دون إنترنت بعد التحميل الأول.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="أذكاري">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self'; worker-src 'self'; manifest-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<title>أذكاري تُنير يومي</title>
<style>
:root{color-scheme:light;--teal:#146a71;--ink:#173f50;--paper:#fbf3e4}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Tahoma,Arial,sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible{outline:3px solid #b64d68;outline-offset:3px}[hidden]{display:none!important}.install-bar{display:flex;align-items:center;gap:10px;padding:7px 14px;min-height:55px;background:#f6ecd8;border-bottom:1px solid #dfd5c3;flex:none}.app-icon{width:36px;height:36px;border-radius:10px}.app-label{font-size:13px;font-weight:bold}.save-status{font-size:10px;color:#526c65;margin-top:4px}.bar-copy{flex:1;min-width:0}.install-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--teal);color:#fff9e9;border:0;border-radius:13px;padding:10px 13px;min-height:40px;font-weight:bold;font-size:12px;white-space:nowrap}.install-button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}iframe{display:block;border:0;width:100%;min-height:0;flex:1;background:var(--paper)}dialog{border:0;border-radius:24px;background:var(--paper);color:var(--ink);width:min(430px,calc(100% - 32px));max-height:90dvh;overflow:auto;padding:26px;box-shadow:0 20px 70px #0d343c55}dialog::backdrop{background:#173f5088;backdrop-filter:blur(3px)}.dialog-icon{display:block;width:86px;height:86px;border-radius:24px;margin:0 auto 18px}h1{font-size:21px;text-align:center;margin:0 0 12px;color:var(--teal)}dialog p{line-height:1.9;font-size:14px;margin:12px 0}dialog .hint{font-size:12px;color:#60726a}dialog button{width:100%;margin-top:9px}.secondary{border:1px solid #cfc5b5;border-radius:13px;padding:10px;background:transparent;color:var(--teal);font-weight:bold;min-height:43px}.error-page{position:fixed;inset:60px 12px 12px;background:var(--paper);display:grid;place-content:center;text-align:center;padding:24px}.error-page a{color:var(--teal)}@media(max-height:550px) and (orientation:landscape){.install-bar{min-height:40px;padding:3px 14px}.app-icon{width:28px;height:28px;border-radius:8px}.app-label{font-size:11px}.bar-copy{display:flex;align-items:center;gap:12px}.save-status{margin:0;font-size:9px}.install-button{padding:6px 12px;min-height:32px;font-size:11px}}@media(display-mode:standalone),(display-mode:fullscreen){.install-bar{display:none}}@media print{.install-bar{display:none}iframe{height:100vh}}
</style>
</head>
<body>
<header class="install-bar" id="installBar">
 <img class="app-icon" src="./icon-192.png" alt="">
 <div class="bar-copy"><div class="app-label">كتيّبي معي أينما أذهب</div><div class="save-status" id="saveStatus" role="status">افتح الكتيّب مرة واحدة ليُحفظ على جهازك</div></div>
 <button class="install-button" id="installButton" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v5h14v-5"/></svg><span>حفظ التطبيق</span></button>
</header>
<iframe id="book" src="./book.html" title="كتيّب أذكاري المصوّر والمسموع" allow="autoplay; fullscreen"></iframe>
<dialog id="installHelp" aria-labelledby="installTitle">
 <img class="dialog-icon" src="./icon-512.png" alt="أيقونة أذكاري: كتاب وهلال">
 <h1 id="installTitle">أذكاري على هاتفي</h1>
 <p id="installInstructions"></p>
 <p class="hint" id="installNote">تظهر أيقونة «أذكاري» على شاشة هاتفك، ويفتح الكتيّب في نافذة مستقلة.</p>
 <button class="install-button" id="promptButton" hidden>تثبيت أذكاري</button>
 <button class="secondary" id="retrySave" hidden>إعادة تحميل الكتيّب للحفظ</button>
 <button class="secondary" id="closeHelp">فهمت</button>
</dialog>
<noscript><p>لفتح التطبيق، فعّل JavaScript أو <a href="./book.html">افتح الكتيّب مباشرة</a>.</p></noscript>
<script>
(()=>{'use strict';
 const $=id=>document.getElementById(id), help=$('installHelp');
 const standalone=()=>matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;
 const localFile=location.protocol==='file:';
 const apple=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 let installEvent=null, installing=false;
 function syncDisplay(){if(standalone())$('installBar').hidden=true;}
 function setHelp(){
  $('promptButton').hidden=!installEvent;
  if(localFile){$('installInstructions').textContent='للتثبيت، افتح رابط الكتيّب المنشور على الإنترنت في Chrome. لا يمكن تثبيت نسخة HTML من مجلد التنزيلات.';}
  else if(standalone()){$('installInstructions').textContent='أذكاري مثبت بالفعل على جهازك. يمكنك فتحه من أيقونته على الشاشة الرئيسية.';}
  else if(installEvent){$('installInstructions').textContent='احفظ كتيّبك على شاشة الهاتف، ثم افتحه من أيقونة «أذكاري» في أي وقت.';}
  else if(apple){$('installInstructions').textContent='افتح الكتيّب في Safari، ثم اضغط «مشاركة» واختر «إضافة إلى الشاشة الرئيسية»، ثم «إضافة». فعّل «فتح كتطبيق ويب» إذا ظهر هذا الخيار.';}
  else{$('installInstructions').textContent='افتح هذا الرابط في Chrome أو Samsung Internet. من قائمة المتصفح ⋮ اختر «إضافة إلى الشاشة الرئيسية» ثم «تثبيت». إذا لم يظهر الخيار بعد، أبقِ الصفحة مفتوحة قليلًا ثم حاول مجددًا.';}
 }
 function showHelp(){setHelp();if(!help.open)help.showModal();}
 async function install(){
  if(!installEvent){showHelp();return;}
  if(installing)return;
  const event=installEvent;installEvent=null;installing=true;
  try{await event.prompt();const choice=await event.userChoice;if(choice.outcome==='accepted'){if(help.open)help.close();$('saveStatus').textContent='تابع تأكيد التثبيت على هاتفك';}else{showHelp();}}
  catch{showHelp();}finally{installing=false;setHelp();}
 }
 window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installEvent=event;if(help.open)setHelp();});
 window.addEventListener('appinstalled',()=>{installEvent=null;$('installBar').hidden=true;if(help.open)help.close();});
 $('installButton').addEventListener('click',install);$('promptButton').addEventListener('click',install);
 $('closeHelp').addEventListener('click',()=>help.close());
 help.addEventListener('click',e=>{if(e.target===help){const r=help.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)help.close();}});
 $('retrySave').addEventListener('click',()=>location.reload());
 matchMedia('(display-mode: standalone)').addEventListener('change',syncDisplay);syncDisplay();
 const saved=()=>{$('saveStatus').textContent='محفوظ • جاهز دون إنترنت';$('retrySave').hidden=true;};
 const failed=()=>{$('saveStatus').textContent='لم يكتمل الحفظ؛ أعد فتحه مع الإنترنت';$('retrySave').hidden=false;};
 if(!localFile&&window.isSecureContext&&'serviceWorker' in navigator){
  $('saveStatus').textContent='جارٍ حفظ الكتيّب والصوت على جهازك…';
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='ADHKARI_OFFLINE_READY')saved();});
  window.addEventListener('load',()=>{
   navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).then(reg=>{
    const watch=worker=>{if(worker)worker.addEventListener('statechange',()=>{if(worker.state==='redundant')failed();});};
    watch(reg.installing);reg.addEventListener('updatefound',()=>watch(reg.installing));
    navigator.serviceWorker.ready.then(saved);
   }).catch(failed);
  },{once:true});
 }else{$('saveStatus').textContent=localFile?'التثبيت متاح من رابط الكتيّب المنشور':'للتثبيت والحفظ، افتح الرابط الآمن في Chrome';}
})();
</script>
</body>
</html>
